<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Roleplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --bg2: #141418;
      --bg3: #1a1a20;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text1: #f0ede8;
      --text: #f0ede8;
      --text2: #9b9793;
      --text3: #5a5754;
      --primary: #4a90e2;
      --accent: #c9a96e;
      --accent2: #8b6d42;
      --accent-glow: rgba(201,169,110,0.15);
      --user-bubble: #1e1e28;
      --ai-bubble: #16161e;
      --danger: #c25050;
      --success: #5a9e6e;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    #root { display: flex; height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .logo span {
      color: var(--text2);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      display: block;
      margin-top: 2px;
    }

    .sidebar-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
    }

    .api-input-wrap { position: relative; }
    .api-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text2);
      font-size: 11px;
      font-family: 'DM Sans', monospace;
    }

    .eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text3);
      font-size: 14px;
      cursor: pointer;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 11px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text3);
    }
    .dot.ok { background: var(--success); }
    .dot.no { background: var(--danger); }

    .model-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
    }

    /* Persona List */
    .personality-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .persona-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .persona-card:hover { border-color: var(--border2); }
    .persona-card.active { border-color: var(--accent); background: rgba(201,169,110,0.08); }

    .persona-image-thumb {
      width: 100%;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .persona-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 14px;
    }

    .persona-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .persona-desc {
      font-size: 11px;
      color: var(--text3);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .persona-badge {
      display: inline-block;
      background: rgba(201,169,110,0.2);
      color: var(--accent2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
    }

    .add-persona-btn {
      background: none;
      border: 1px dashed var(--border2);
      border-radius: 8px;
      padding: 20px 12px;
      color: var(--text3);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .add-persona-btn:hover {
      border-color: var(--accent2);
      color: var(--accent);
    }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
    }

    .chat-title {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-style: italic;
      color: var(--text);
    }

    .chat-subtitle {
      font-size: 11px;
      color: var(--text3);
      margin-top: 1px;
    }

    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .icon-btn:hover { border-color: var(--border2); color: var(--text); }
    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* MESSAGES */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text3);
    }

    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; color: var(--text); margin-bottom: 8px; }
    .empty-sub { font-size: 13px; color: var(--text3); }

    .message {
      display: flex;
      gap: 12px;
      animation: msgIn 0.3s ease;
    }

    @keyframes msgIn { from { opacity: 0; } to { opacity: 1; } }

    .message.user { justify-content: flex-end; }
    .message.user .avatar { background: var(--bg3); }
    .message.user .bubble { background: var(--user-bubble); }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--ai-bubble);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text2);
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      max-width: 600px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .bubble-meta {
      font-size: 11px;
      color: var(--text3);
      margin-top: 4px;
      padding: 0 4px;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      height: 16px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text3);
      animation: dot 1.4s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 60%, 100% { opacity: 0.5; }
      30% { opacity: 1; }
    }

    /* INPUT AREA */
    .input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      background: var(--bg2);
    }

    .msg-textarea {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      line-height: 1.5;
      transition: border-color 0.2s;
      overflow-y: auto;
    }
    .msg-textarea::placeholder { color: var(--text3); }
    .msg-textarea:focus { border-color: var(--accent2); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0d0d0f;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover { background: #d9b97e; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--bg3); color: var(--text3); cursor: not-allowed; }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
      padding: 20px;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 460px;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .field input, .field textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
    }

    .field textarea {
      resize: vertical;
      min-height: 100px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-ghost {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      padding: 9px 18px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--border2); color: var(--text); }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0d0d0f;
      padding: 9px 18px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #d9b97e; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      color: var(--text);
      z-index: 200;
      animation: toastIn 0.25s ease;
      max-width: 280px;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    /* SLIDER */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-wrap input[type=range] {
      flex: 1;
      appearance: none;
      -webkit-appearance: none;
      height: 3px;
      border-radius: 2px;
      background: var(--border2);
      outline: none;
      border: none;
      padding: 0;
    }

    .slider-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .slider-val {
      font-size: 12px;
      color: var(--accent);
      min-width: 28px;
      text-align: right;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        z-index: 40;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .main { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
